<title>БЛИЗКО — То, что далеко, становится БЛИЗКО</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* БЛИЗКО — дизайн-токены, сброс и базовая типографика */
:root {
  --teal-900: #08393b;
  --teal-800: #0b4b4e;
  --teal-700: #0e5a5c;
  --teal-600: #157073;
  --teal-500: #2a8a8c;
  --teal-100: #d9ecec;
  --cream: #faf6ec;
  --cream-2: #f4eedd;
  --sand: #e6d6b8;
  --sand-2: #efe3cb;
  --pink: #f3cdc7;
  --pink-2: #f8e2de;
  --pink-600: #e2a198;
  --blue: #a9c7ce;
  --blue-2: #cfe0e4;
  --ink: #2b2f33;
  --ink-2: #4a5157;
  --ink-3: #6b7278;
  --line: rgba(43, 47, 51, .14);
  --line-light: rgba(250, 246, 236, .22);
  --thread: #e4573d; /* цвет красной «нити» из логотипа — только для декоративных штрихов */

  --font-head: 'Montserrat', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;

  --r-sm: 10px;
  --r-md: 18px;
  --r-lg: 28px;
  --r-xl: 44px;
  --shadow-sm: 0 1px 2px rgba(8, 57, 59, .06), 0 4px 14px rgba(8, 57, 59, .06);
  --shadow-md: 0 2px 4px rgba(8, 57, 59, .06), 0 14px 40px rgba(8, 57, 59, .12);

  --gutter: clamp(16px, 4vw, 40px);
  --maxw: 1240px;
  --header-h: 72px;
  --ease: cubic-bezier(.22, .8, .3, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; color-scheme: light; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 400 1rem/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
img, svg, video { max-width: 100%; display: block; }
a { color: inherit; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: .2em; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; line-height: 1.1; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; list-style: none; }
::selection { background: var(--pink); color: var(--teal-900); }

:focus-visible { outline: 3px solid var(--teal-500); outline-offset: 3px; border-radius: 6px; }
.on-dark :focus-visible { outline-color: var(--pink); }

.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 200; background: var(--teal-700); color: var(--cream); padding: 10px 16px; border-radius: 999px; transition: top .2s; }
.skip-link:focus { top: 12px; }

.container { width: 100%; max-width: calc(var(--maxw) + var(--gutter) * 2); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: clamp(56px, 9vw, 120px); }
.section--tight { padding-block: clamp(32px, 5vw, 64px); }

.display { font-size: clamp(2.5rem, 6.4vw, 5.4rem); font-weight: 800; line-height: 1; letter-spacing: -.035em; }
.h1 { font-size: clamp(2.1rem, 4.8vw, 4rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.04; }
.h2 { font-size: clamp(1.7rem, 3.4vw, 2.8rem); font-weight: 800; letter-spacing: -.028em; }
.h3 { font-size: clamp(1.15rem, 1.8vw, 1.45rem); font-weight: 700; }
.lead { font-size: clamp(1.05rem, 1.5vw, 1.25rem); line-height: 1.55; color: var(--ink-2); max-width: 58ch; }
.eyebrow { font: 600 .75rem/1 var(--font-head); letter-spacing: .14em; text-transform: uppercase; color: var(--teal-600); }
.muted { color: var(--ink-3); }
.on-dark .eyebrow { color: var(--pink); }
.on-dark .lead, .on-dark .muted { color: rgba(250, 246, 236, .78); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* БЛИЗКО — компоненты */

/* ——— Кнопки ——— */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; padding: .8em 1.4em; border-radius: 999px; border: 1.5px solid transparent; font: 600 .95rem/1.1 var(--font-head); text-decoration: none; letter-spacing: -.005em; transition: transform .2s var(--ease), background .2s, color .2s, border-color .2s, box-shadow .2s; white-space: nowrap; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn--primary { background: var(--teal-700); color: var(--cream); box-shadow: 0 6px 18px rgba(14, 90, 92, .28); }
.btn--primary:hover { background: var(--teal-800); }
.btn--pink { background: var(--pink); color: var(--teal-900); }
.btn--pink:hover { background: var(--pink-600); }
.btn--ghost { background: transparent; border-color: currentColor; color: var(--teal-700); }
.btn--ghost:hover { background: var(--teal-700); color: var(--cream); border-color: var(--teal-700); }
.on-dark .btn--ghost { color: var(--cream); }
.on-dark .btn--ghost:hover { background: var(--cream); color: var(--teal-800); border-color: var(--cream); }
.on-dark .btn--primary { background: var(--pink); color: var(--teal-900); box-shadow: none; }
.btn--link { padding: .3em 0; border-radius: 0; color: var(--teal-700); border-bottom: 1.5px solid currentColor; }
.btn--link:hover { transform: none; gap: .8em; }
.on-dark .btn--link { color: var(--pink); }
.btn--sm { padding: .62em 1.05em; font-size: .85rem; }
.btn--lg { padding: 1em 1.8em; font-size: 1.02rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--teal-700); font-size: .85rem; text-decoration: underline; text-underline-offset: .2em; }
.on-dark .linkbtn { color: var(--pink); }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: inherit; text-decoration: none; transition: background .2s; }
.iconbtn:hover { background: rgba(14, 90, 92, .1); }
.badge { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--teal-700); color: var(--cream); font: 700 .68rem/18px var(--font-head); text-align: center; }

/* ——— Чипы, теги ——— */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: .45em; padding: .5em 1em; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font: 500 .86rem/1.2 var(--font-body); color: var(--ink); text-decoration: none; transition: all .18s; }
.chip:hover:not(:disabled) { border-color: var(--teal-700); }
.chip.is-on, .chip[aria-current] { background: var(--teal-700); border-color: var(--teal-700); color: var(--cream); }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip--static { border-color: transparent; background: var(--cream-2); padding: .32em .8em; font-size: .76rem; }
.chip__n { font-size: .72em; opacity: .65; }
.chip--x svg { opacity: .8; }
.tag { display: inline-block; padding: .28em .7em; border-radius: 999px; font: 600 .7rem/1.2 var(--font-head); letter-spacing: .04em; }
.tag--demo { background: var(--sand); color: var(--ink); }
.tag--ok { background: var(--teal-100); color: var(--teal-800); }

/* ——— Медиа и иллюстрации ——— */
.media { position: relative; overflow: hidden; background: var(--sand-2); }
.media svg, .media img { width: 100%; height: 100%; object-fit: cover; }
.media::after { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .35;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
.thumb { width: 52px; height: 52px; border-radius: 12px; flex: none; }

/* ——— Сетки ——— */
.grid { display: grid; gap: clamp(16px, 2.4vw, 28px); grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.grid__empty { grid-column: 1 / -1; }
.shead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; margin-bottom: clamp(24px, 4vw, 48px); }
.shead > div { display: grid; gap: 12px; }
.shead .h2 { max-width: 20ch; }
.fineprint { margin-top: 20px; font-size: .8rem; line-height: 1.5; color: var(--ink-3); max-width: 72ch; }
.on-dark .fineprint { color: rgba(250, 246, 236, .7); }

/* растягиваем ссылку на всю карточку */
.stretched { all: unset; cursor: pointer; }
.stretched::after { content: ''; position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.stretched:focus-visible::after { outline: 3px solid var(--teal-500); outline-offset: 3px; }

/* ——— Избранное (сердце) ——— */
.fav { position: absolute; top: 12px; right: 12px; z-index: 3; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; border: 0; background: rgba(250, 246, 236, .92); color: var(--teal-800); backdrop-filter: blur(6px); transition: transform .2s var(--ease), background .2s; }
.fav:hover { transform: scale(1.1); }
.fav svg { transition: fill .2s, stroke .2s; }
.fav[aria-pressed="true"] { background: var(--pink); color: #b4442f; }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.fav--lg { position: static; width: 50px; height: 50px; border: 1.5px solid var(--line); background: transparent; }

/* ——— Карточка товара ——— */
.pcard { position: relative; display: flex; flex-direction: column; background: #fff; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); transition: transform .3s var(--ease), box-shadow .3s; }
.pcard:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.pcard__media { position: relative; }
.pcard__media .media { border-radius: 0; }
.pcard__media .tag { position: absolute; left: 12px; top: 12px; z-index: 2; }
.pcard__body { display: flex; flex-direction: column; gap: 8px; padding: 18px 18px 20px; flex: 1; }
.pcard__meta { font-size: .8rem; color: var(--ink-3); position: relative; z-index: 2; }
.pcard__meta a { text-decoration: none; font-weight: 600; color: var(--teal-700); }
.pcard__meta a:hover { text-decoration: underline; }
.pcard__title { font: 700 1.02rem/1.25 var(--font-head); letter-spacing: -.01em; }
.pcard__cat { font-size: .8rem; color: var(--ink-3); }
.pcard__foot { margin-top: auto; padding-top: 12px; display: grid; gap: 12px; }
.pcard__foot .btn { position: relative; z-index: 2; width: 100%; }
.price { display: flex; align-items: baseline; gap: 10px; font: 700 1.2rem/1 var(--font-head); }
.price s { font: 500 .85rem var(--font-body); color: var(--ink-3); }
.price--unknown { font: 500 .83rem/1.4 var(--font-body); color: var(--ink-3); }
.price__note { display: block; margin-top: 6px; font-size: .78rem; color: var(--ink-3); }

/* ——— Карточка бренда ——— */
.bcard { position: relative; background: var(--cream-2); border-radius: var(--r-lg); overflow: hidden; transition: transform .3s var(--ease); }
.bcard:hover { transform: translateY(-4px); }
.bcard .tag { position: absolute; left: 12px; top: 12px; z-index: 2; }
.bcard__mono { position: absolute; z-index: 2; right: 14px; top: 14px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--cream); color: var(--teal-800); font: 800 .95rem var(--font-head); }
.bcard__body { display: grid; gap: 6px; padding: 18px 20px 22px; }
.bcard__count { font-size: .82rem; font-weight: 600; color: var(--teal-700); margin-top: 6px; }

/* ——— Карточка статьи ——— */
.acard { position: relative; display: flex; flex-direction: column; gap: 16px; }
.acard__media { position: relative; border-radius: var(--r-lg); overflow: hidden; }
.acard__media .media { transition: transform .6s var(--ease); }
.acard:hover .acard__media .media { transform: scale(1.04); }
.acard__body { display: grid; gap: 10px; }
.acard__meta { display: flex; align-items: center; gap: 12px; font-size: .78rem; color: var(--ink-3); }
.acard__title { transition: color .2s; }
.acard:hover .acard__title { color: var(--teal-600); }
.acard__lead { color: var(--ink-2); font-size: .95rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.acard--cover .acard__media { border-radius: var(--r-xl); }
.acard--row { flex-direction: row; align-items: center; gap: 18px; }
.acard--row .acard__media { width: clamp(96px, 28%, 150px); flex: none; border-radius: var(--r-md); }
.acard--row .fav { top: 6px; right: 6px; width: 34px; height: 34px; }
.acard--row .fav svg { width: 16px; height: 16px; }

/* ——— Подборки и регионы (карточки) ——— */
.ccard { position: relative; display: block; min-height: 260px; border-radius: var(--r-lg); overflow: hidden; text-decoration: none; color: var(--cream); isolation: isolate; transition: transform .3s var(--ease); }
.ccard:hover { transform: translateY(-4px); }
.ccard__media { position: absolute; inset: 0; z-index: -2; }
.ccard::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 30%, rgba(8, 57, 59, .82)); }
.ccard__body { position: absolute; inset: auto 0 0 0; padding: 22px; display: grid; gap: 6px; }
.ccard__count { font: 600 .72rem/1 var(--font-head); letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.ccard__title { font: 800 clamp(1.15rem, 2vw, 1.5rem)/1.12 var(--font-head); letter-spacing: -.02em; max-width: 16ch; }
.ccard__go { position: absolute; right: 20px; bottom: 22px; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--cream); color: var(--teal-800); transition: transform .3s var(--ease); }
.ccard:hover .ccard__go { transform: translateX(4px) rotate(-12deg); }
.rcard { position: relative; display: grid; background: #fff; border-radius: var(--r-lg); overflow: hidden; transition: transform .3s var(--ease), box-shadow .3s; box-shadow: var(--shadow-sm); }
.rcard:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.rcard--soon .media { filter: saturate(.5); }
.rcard__body { display: grid; gap: 8px; padding: 18px 20px 22px; align-content: start; }

/* ——— Пустое состояние ——— */
.empty { display: grid; justify-items: center; gap: 12px; padding: clamp(32px, 6vw, 64px) 20px; text-align: center; background: var(--cream-2); border-radius: var(--r-xl); }
.empty p { max-width: 46ch; }
.empty__mascot { width: 84px; height: auto; }

/* ——— Списки ——— */
.facts { display: grid; gap: 8px; margin: 14px 0; }
.facts li { position: relative; padding-left: 22px; font-size: .92rem; color: var(--ink-2); }
.facts li::before { content: ''; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border-radius: 50%; background: var(--pink-600); }
.ticks { display: grid; gap: 14px; margin: 24px 0 32px; }
.ticks li { display: flex; gap: 12px; align-items: flex-start; }
.ticks svg { flex: none; margin-top: 2px; padding: 3px; border-radius: 50%; background: var(--teal-700); color: var(--cream); width: 24px; height: 24px; }
.ticks--lg { font-size: 1.05rem; }
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: .82rem; color: var(--ink-3); margin-bottom: 20px; }
.crumbs a { text-decoration: none; color: inherit; }
.crumbs a:hover { text-decoration: underline; }
.on-dark .crumbs { color: rgba(250, 246, 236, .75); }

/* ——— Формы ——— */
.field { display: grid; gap: 6px; margin-bottom: 18px; }
.field label { font: 600 .85rem var(--font-head); }
.req { color: var(--thread); }
.field input[type="text"], .field input[type="email"], .field input[type="url"], .field input[type="search"], .field input[type="number"], .field select, .field textarea, .bigsearch input, .subscribe input, .toolbar__sort select, .range input {
  width: 100%; padding: .8em 1em; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: #fff; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.field input:focus, .field select:focus, .field textarea:focus, .range input:focus, .subscribe input:focus, .bigsearch input:focus { outline: none; border-color: var(--teal-600); box-shadow: 0 0 0 4px rgba(42, 138, 140, .2); }
.field [aria-invalid="true"] { border-color: #c4452f; }
.field__err { min-height: 0; font-size: .8rem; color: #b13a26; }
.field__hint { font-size: .8rem; color: var(--ink-3); }
.field--check label { display: flex; gap: 10px; align-items: flex-start; font: 400 .9rem var(--font-body); }
.field--check input { margin-top: .25em; width: 18px; height: 18px; accent-color: var(--teal-700); }
.form__grid { display: grid; gap: 0 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.form__msg { min-height: 1.4em; margin-top: 10px; font-size: .88rem; flex-basis: 100%; }
.form__msg.is-ok { color: var(--teal-600); }
.form__msg.is-err { color: #b13a26; }
.on-dark .form__msg.is-ok { color: var(--pink); }
.on-dark .form__msg.is-err { color: #ffb3a3; }
.subscribe { display: flex; flex-wrap: wrap; gap: 10px; }
.subscribe input { flex: 1 1 200px; border-radius: 999px; padding-inline: 1.3em; }
.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: .92rem; }
.check input { width: 18px; height: 18px; accent-color: var(--teal-700); flex: none; }
.check span { flex: 1; }
.check em { font-style: normal; font-size: .76rem; color: var(--ink-3); }
.bigsearch { display: flex; gap: 10px; margin-top: 24px; max-width: 640px; }
.bigsearch input { border-radius: 999px; padding-inline: 1.3em; }

/* ——— Шапка и навигация ——— */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; height: var(--header-h); background: color-mix(in srgb, var(--cream) 88%, transparent); backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1px solid transparent; transition: border-color .25s, box-shadow .25s; }
.header.is-scrolled { border-color: var(--line); }
.header__in { display: flex; align-items: center; gap: 24px; height: 100%; }
.logo { display: block; flex: none; margin-block: -8px; }
.logo img { width: 84px; height: auto; transition: transform .4s var(--ease); }
.logo:hover img { transform: rotate(-4deg) scale(1.04); }
.nav { display: flex; gap: clamp(14px, 2.4vw, 34px); margin-left: auto; }
.nav a { position: relative; padding: 8px 2px; font: 600 .93rem var(--font-head); text-decoration: none; letter-spacing: -.005em; }
.nav a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 2px; height: 2px; background: var(--teal-700); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease); }
.nav a:hover::after, .nav a[aria-current]::after { transform: scaleX(1); }
.header__tools { display: flex; align-items: center; gap: 6px; }
.header__burger { display: none; }
.mnav { position: fixed; inset: var(--header-h) 0 0 0; z-index: 55; background: var(--cream); padding: 24px var(--gutter) 40px; overflow: auto; }
.mnav nav { display: grid; gap: 4px; }
.mnav a:not(.btn) { padding: 16px 0; font: 800 1.7rem var(--font-head); letter-spacing: -.03em; text-decoration: none; border-bottom: 1px solid var(--line); }
.mnav .btn { margin-top: 24px; }
.mnav__mascot { width: 130px; margin: 24px 0 0 auto; }
body.menu-open { overflow: hidden; }
@media (max-width: 900px) {
  .nav, .header__cta { display: none; }
  .header__tools { margin-left: auto; }
  .header__burger { display: inline-grid; }
  :root { --header-h: 64px; }
  .logo img { width: 70px; }
}

/* ——— Подвал ——— */
.footer { background: var(--teal-900); color: var(--cream); padding-block: clamp(48px, 7vw, 88px) 32px; }
.footer a { text-decoration: none; }
.footer a:hover { text-decoration: underline; }
.footer__top { display: grid; gap: 40px; grid-template-columns: 1.5fr 1fr 1fr 1.6fr; padding-bottom: 48px; border-bottom: 1px solid var(--line-light); }
.footer__brand { display: grid; gap: 14px; align-content: start; max-width: 36ch; }
.footer__brand img { width: 104px; height: auto; }
.footer__slogan { font: 800 1.15rem/1.2 var(--font-head); letter-spacing: -.02em; }
.footer__col { display: grid; gap: 10px; align-content: start; }
.footer__h { font: 600 .74rem var(--font-head); letter-spacing: .14em; text-transform: uppercase; color: var(--pink); margin-bottom: 8px; }
.footer__news { display: grid; gap: 14px; align-content: start; }
.footer__bottom { display: grid; gap: 8px; padding-top: 24px; font-size: .82rem; }
.footer .muted { color: rgba(250, 246, 236, .7); }
@media (max-width: 900px) { .footer__top { grid-template-columns: 1fr 1fr; } .footer__brand, .footer__news { grid-column: 1 / -1; } }

/* ——— Карта ——— */
.map { --land: #12686b; --land-dot: rgba(250, 246, 236, .38); --edge: rgba(250, 246, 236, .6); --grid: rgba(250, 246, 236, .08);
  position: relative; width: 100%; }
.map svg { width: 100%; height: 100%; display: block; overflow: visible; }
.map__land { fill: var(--land); }
.map__dot { fill: var(--land-dot); }
.map__edge { fill: none; stroke: var(--edge); stroke-width: 1.4; stroke-linejoin: round; }
.map__grid { fill: none; stroke: var(--grid); stroke-width: 1; }
.map__thread { fill: none; stroke: var(--thread); stroke-width: 2.4; stroke-dasharray: 7 9; stroke-linecap: round; opacity: .9; animation: dash 24s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -320; } }
.regions__map .map { --land: var(--blue-2); --land-dot: rgba(14, 90, 92, .3); --edge: rgba(14, 90, 92, .55); --grid: rgba(14, 90, 92, .08); }

/* Точка-якорь нулевого размера стоит ровно в координате; точка и подпись позиционируются от неё */
.pin { position: absolute; z-index: 2; width: 0; height: 0; padding: 0; margin: 0; border: 0; background: none; color: var(--cream); text-decoration: none; cursor: pointer; }
.pin:focus-visible { outline: none; }
.pin:focus-visible .pin__dot { outline: 3px solid var(--pink); outline-offset: 4px; }
.regions__map .pin { color: var(--teal-900); }
.regions__map .pin:focus-visible .pin__dot { outline-color: var(--teal-500); }
.pin::before { content: ''; position: absolute; left: 0; top: 0; width: 48px; height: 48px; translate: -50% -50%; border-radius: 50%; } /* увеличенная зона касания */
.pin__dot { position: absolute; left: 0; top: 0; translate: -50% -50%; width: 18px; height: 18px; border-radius: 50%; background: var(--pink); border: 3px solid var(--teal-900); transition: scale .25s var(--ease); }
.regions__map .pin__dot { border-color: var(--cream); background: var(--teal-700); }
.pin--active .pin__dot { animation: pulse 2.4s infinite; }
.pin--soon .pin__dot { background: transparent; border-color: currentColor; width: 14px; height: 14px; opacity: .85; }
.pin:hover .pin__dot, .pin.is-active .pin__dot { scale: 1.4; }
.pin.is-dim { opacity: .3; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(243, 205, 199, .75); } 70% { box-shadow: 0 0 0 16px rgba(243, 205, 199, 0); } 100% { box-shadow: 0 0 0 0 rgba(243, 205, 199, 0); } }
.regions__map .pin--active .pin__dot { animation-name: pulse-dark; }
@keyframes pulse-dark { 0% { box-shadow: 0 0 0 0 rgba(14, 90, 92, .55); } 70% { box-shadow: 0 0 0 16px rgba(14, 90, 92, 0); } 100% { box-shadow: 0 0 0 0 rgba(14, 90, 92, 0); } }
.pin__label { position: absolute; display: grid; line-height: 1.15; white-space: nowrap; font-size: .82rem; text-shadow: 0 0 6px var(--teal-800), 0 0 2px var(--teal-800); pointer-events: none; }
.regions__map .pin__label { text-shadow: 0 0 6px var(--blue-2), 0 0 3px var(--blue-2); }
.pin__label b { font: 700 .88rem var(--font-head); }
.pin__label i { font-style: normal; opacity: .85; font-size: .75rem; }
.pin--right .pin__label { left: 18px; top: 0; translate: 0 -50%; text-align: left; }
.pin--left .pin__label { right: 18px; top: 0; translate: 0 -50%; text-align: right; }
.pin--bottom .pin__label { left: 0; top: 16px; translate: -50% 0; text-align: center; }
.pin:hover .pin__label b { text-decoration: underline; }
@media (max-width: 640px) {
  .pin__label i { display: none; }
  .pin__label b { font-size: .72rem; }
  .pin:not(.is-active):not(:hover) .pin__label { display: none; }
  .pin--active .pin__label, .pin.is-active .pin__label { display: grid; }
}

/* ——— Диалоги ——— */
dialog { padding: 0; border: 0; color: var(--ink); background: var(--cream); }
dialog::backdrop { background: rgba(8, 57, 59, .55); backdrop-filter: blur(4px); }
.search { width: min(720px, calc(100% - 24px)); max-height: min(80vh, 760px); margin: 8vh auto auto; border-radius: var(--r-lg); box-shadow: var(--shadow-md); }
.search__form { display: flex; align-items: center; gap: 10px; padding: 14px 16px 14px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--cream); z-index: 2; }
.search__form input { flex: 1; border: 0; background: transparent; font: 500 1.1rem var(--font-head); padding: .6em 0; outline: none; }
.search__res { padding: 12px 24px 24px; display: grid; gap: 16px; }
.search__h { font: 600 .72rem var(--font-head); letter-spacing: .14em; text-transform: uppercase; color: var(--teal-600); margin: 8px 0; }
.search__res li a { display: flex; align-items: center; gap: 14px; padding: 8px; margin: 0 -8px; border-radius: var(--r-md); text-decoration: none; }
.search__res li a:hover, .search__res li a:focus-visible { background: var(--cream-2); }
.search__res li span { display: grid; line-height: 1.3; }
.search__res li i { font-style: normal; font-size: .82rem; color: var(--ink-3); }
.search__hint { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search__empty { display: flex; align-items: center; gap: 16px; }
.search__empty img { width: 64px; flex: none; }
.search__all { justify-self: start; }

.quick { width: min(980px, calc(100% - 24px)); max-height: calc(100vh - 32px); margin: auto; border-radius: var(--r-xl); box-shadow: var(--shadow-md); overflow: auto; }
.quick__in { position: relative; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
.quick__x { position: absolute; top: 12px; right: 12px; z-index: 3; background: var(--cream); }
.quick__media { background: var(--cream-2); padding: 20px; display: grid; gap: 10px; align-content: start; }
.quick__media .media { border-radius: var(--r-lg); }
.quick__note { font-size: .74rem; color: var(--ink-3); text-align: center; }
.quick__body { display: grid; gap: 14px; align-content: start; padding: clamp(24px, 4vw, 44px); }
.quick__body .h2 { font-size: clamp(1.4rem, 2.6vw, 2rem); }
.quick__cat { font-size: .85rem; color: var(--ink-3); }
.quick__desc { color: var(--ink-2); }
.quick__actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.quick__src { font-size: .78rem; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 700px) { .quick__in { grid-template-columns: 1fr; } .quick__media { padding: 56px 20px 0; } .quick__media .media { aspect-ratio: 16/10 !important; } }

/* ——— Тост ——— */
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 100; transform: translate(-50%, 24px); padding: 12px 22px; border-radius: 999px; background: var(--teal-900); color: var(--cream); font-size: .9rem; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: all .35s var(--ease); max-width: calc(100% - 32px); text-align: center; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* ——— Близя ——— */
.blizya { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 70; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.blizya__btn { width: 68px; height: 68px; padding: 0; border: 3px solid var(--cream); border-radius: 50%; background: var(--pink); overflow: hidden; box-shadow: var(--shadow-md); transition: transform .3s var(--ease); }
.blizya__btn img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 78%; transform: scale(1.5) translateY(6%); }
.blizya__btn:hover { transform: scale(1.08) rotate(-5deg); }
.blizya__bubble { position: relative; width: min(330px, calc(100vw - 32px)); padding: 20px 20px 16px; border-radius: var(--r-lg) var(--r-lg) 6px var(--r-lg); background: #fff; box-shadow: var(--shadow-md); animation: pop .4s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.96); } }
.blizya__x { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; }
.blizya__name { font: 700 .75rem var(--font-head); letter-spacing: .12em; text-transform: uppercase; color: var(--teal-600); margin-bottom: 6px; }
.blizya__text { font-size: .94rem; line-height: 1.5; }
.blizya__actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
.blizya__more { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.blizya__more .linkbtn { color: var(--ink-3); }
.blizya__more .linkbtn:first-child { color: var(--teal-700); }

/* ——— Вкладки ——— */
.tabs { display: flex; gap: 8px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
.tab { padding: 12px 18px; border: 0; background: none; font: 700 .95rem var(--font-head); color: var(--ink-3); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--teal-700); border-color: var(--teal-700); }

/* БЛИЗКО — страницы */
.page { animation: fadeUp .5s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
#app:focus { outline: none; }
#app h1:focus { outline: none; }

.band--teal { background: var(--teal-800); color: var(--cream); }
.band--sand { background: var(--sand-2); }
.band--cream2 { background: var(--cream-2); }

.pagehead { padding-block: clamp(40px, 7vw, 96px) clamp(24px, 3vw, 40px); }
.pagehead .container { display: grid; gap: 18px; justify-items: start; }
.pagehead .h1 { max-width: 18ch; }

/* ——— Главная: hero ——— */
.hero { padding-block: clamp(24px, 4vw, 56px) clamp(48px, 7vw, 96px); overflow: hidden; }
.hero__in { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 72px); align-items: center; }
.hero__text { display: grid; gap: clamp(18px, 2.4vw, 28px); justify-items: start; }
.hero__title { max-width: 11ch; }
.hl { color: var(--teal-700); position: relative; white-space: nowrap; }
.hl::after { content: ''; position: absolute; left: -2%; right: -2%; bottom: .02em; height: .22em; background: var(--pink); z-index: -1; border-radius: 99px; }
.hero__cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero__stats { display: flex; flex-wrap: wrap; gap: 12px 36px; margin: 8px 0 0; padding-top: 22px; border-top: 1px solid var(--line); }
.hero__stats div { display: flex; flex-direction: column-reverse; }
.hero__stats dt { font-size: .8rem; color: var(--ink-3); }
.hero__stats dd { margin: 0; font: 800 2rem/1 var(--font-head); letter-spacing: -.03em; color: var(--teal-700); }
.hero__stats small { font-size: .55em; color: var(--ink-3); font-weight: 600; }

.hero__collage { position: relative; aspect-ratio: 1 / 1.08; width: 100%; max-width: 620px; justify-self: end; }
.hero__thread { position: absolute; inset: -4% -6%; width: 112%; height: 108%; max-width: none; fill: none; stroke: var(--thread); stroke-width: 2.6; stroke-dasharray: 7 9; stroke-linecap: round; opacity: .85; animation: dash 30s linear infinite; z-index: 0; }
.tile { position: absolute; z-index: 1; display: block; padding: 0; border: 0; background: none; overflow: hidden; text-decoration: none; cursor: pointer; transition: transform .45s var(--ease), box-shadow .3s; box-shadow: var(--shadow-md); }
.tile:hover { transform: translateY(-6px) rotate(-1.2deg); }
.tile__media { position: absolute; inset: 0; }
.tile__tag { position: absolute; left: 10px; bottom: 10px; z-index: 2; max-width: calc(100% - 20px); padding: .42em .9em; border-radius: 999px; background: rgba(250, 246, 236, .94); color: var(--teal-900); font: 600 .72rem/1.2 var(--font-head); text-align: left; backdrop-filter: blur(4px); }
.tile--arch { left: 0; top: 10%; width: 44%; aspect-ratio: 3 / 4.4; border-radius: 999px 999px 26px 26px; }
.tile--circle { left: 47%; top: 0; width: 36%; aspect-ratio: 1; border-radius: 50%; }
.tile--circle .tile__tag { left: 50%; transform: translateX(-50%); bottom: 14%; text-align: center; width: max-content; max-width: 90%; }
.tile--card { right: 0; top: 33%; width: 40%; aspect-ratio: 4 / 4.6; border-radius: 28px; }
.tile--pill { left: 27%; bottom: 0; width: 50%; aspect-ratio: 2.3 / 1; border-radius: 999px; }
.tile--pill .tile__tag { left: 50%; transform: translateX(-50%); bottom: 14px; width: max-content; }
.tile--sq { left: 2%; bottom: 3%; width: 22%; aspect-ratio: 1; border-radius: 22px; transform: rotate(-6deg); }
.tile--sq .tile__tag { font-size: .62rem; padding: .3em .6em; }
.hero__bunny { position: absolute; right: -2%; bottom: -4%; z-index: 4; width: 30%; pointer-events: none; }
.hero__bunny .mascot { width: 100%; height: auto; filter: drop-shadow(0 16px 20px rgba(8, 57, 59, .25)); transform-origin: 50% 100%; animation: bob 5s ease-in-out infinite; }
@keyframes bob { 50% { transform: rotate(2.5deg) translateY(-6px); } }
.hero__hello { display: none; }
.tile--card .tile__tag { bottom: auto; top: 10px; }
@media (max-width: 900px) {
  .hero__in { grid-template-columns: 1fr; }
  .hero__collage { justify-self: center; max-width: 520px; }
  .hero__title { max-width: 14ch; }
}
@media (max-width: 520px) { .hero__hello { display: none; } .tile__tag { font-size: .62rem; } .tile--circle .tile__tag { bottom: 10%; } }

/* ——— Главная: три опоры ——— */
.pillars { display: grid; gap: 16px; grid-template-columns: repeat(3, 1fr); }
.pillar { position: relative; display: grid; gap: 10px; align-content: start; padding: 28px; border-radius: var(--r-lg); text-decoration: none; min-height: 220px; transition: transform .3s var(--ease); }
.pillar:hover { transform: translateY(-4px); }
.pillar--market { background: var(--teal-700); color: var(--cream); }
.pillar--media { background: var(--pink); color: var(--teal-900); }
.pillar--map { background: var(--blue-2); color: var(--teal-900); }
.pillar__k { font: 800 .76rem var(--font-head); letter-spacing: .18em; opacity: .75; }
.pillar .h3 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; margin-top: 18px; }
.pillar p { max-width: 30ch; opacity: .9; }
.pillar__go { position: absolute; right: 24px; top: 24px; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid currentColor; transition: transform .3s var(--ease); }
.pillar:hover .pillar__go { transform: rotate(-45deg); }
.pillar .btn--link { justify-self: start; margin-top: 8px; color: inherit; }
.pillars--about .pillar { min-height: 240px; }
@media (max-width: 800px) { .pillars { grid-template-columns: 1fr; } .pillar { min-height: 0; } }

/* ——— Главная: регионы ——— */
.band--teal .map { margin-block: 8px 32px; }
.regionlist { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.regionlist__item { display: grid; gap: 4px; padding: 16px 18px; border: 1px solid var(--line-light); border-radius: var(--r-md); text-decoration: none; transition: background .2s, border-color .2s; }
.regionlist__item:hover { background: rgba(250, 246, 236, .08); border-color: var(--pink); }
.regionlist__item b { font: 700 .95rem var(--font-head); }
.regionlist__item span { font-size: .8rem; opacity: .75; }
.regionlist__item.is-soon { opacity: .75; }

/* ——— Главная: подборки ——— */
.mosaic { display: grid; gap: 16px; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 240px; }
.mosaic .ccard { grid-column: span 2; min-height: 0; }
.mosaic .ccard--big { grid-column: span 3; grid-row: span 2; }
.mosaic .ccard--big .ccard__title { font-size: clamp(1.6rem, 3vw, 2.4rem); max-width: 14ch; }
.mosaic .ccard:nth-child(n+2) { grid-column: span 3; }
.mosaic--sm { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); grid-auto-rows: 260px; }
.mosaic--sm .ccard, .mosaic--sm .ccard--big { grid-column: auto; grid-row: auto; }
@media (max-width: 900px) { .mosaic { grid-template-columns: repeat(2, 1fr); } .mosaic .ccard, .mosaic .ccard:nth-child(n+2) { grid-column: span 1; } .mosaic .ccard--big { grid-column: span 2; grid-row: span 1; } }
@media (max-width: 560px) { .mosaic { grid-template-columns: 1fr; grid-auto-rows: 220px; } .mosaic .ccard--big { grid-column: auto; } }

/* ——— Главная: истории ——— */
.stories { display: grid; gap: clamp(16px, 2.4vw, 28px); grid-template-columns: 1.3fr 1fr 1fr; align-items: stretch; }
.story { position: relative; display: flex; flex-direction: column; border-radius: var(--r-xl); overflow: hidden; background: var(--teal-800); color: var(--cream); min-height: 460px; isolation: isolate; transition: transform .4s var(--ease); }
.story:hover { transform: translateY(-5px); }
.story__media { position: absolute; inset: 0; z-index: -2; }
.story::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8, 57, 59, 0) 25%, rgba(8, 57, 59, .88) 90%); }
.story__body { margin-top: auto; padding: clamp(22px, 3vw, 34px); display: grid; gap: 14px; }
.story .eyebrow { color: var(--pink); }
.story__title { font: 800 clamp(1.25rem, 2.1vw, 1.7rem)/1.15 var(--font-head); letter-spacing: -.025em; }
.story--1 .story__title { font-size: clamp(1.5rem, 2.6vw, 2.2rem); }
.story__more { display: inline-flex; align-items: center; gap: 8px; font: 600 .88rem var(--font-head); transition: gap .3s; }
.story:hover .story__more { gap: 14px; }
@media (max-width: 900px) { .stories { grid-template-columns: 1fr; } .story { min-height: 360px; } }

/* ——— Главная: лента ——— */
.feed { display: grid; gap: clamp(24px, 4vw, 56px); grid-template-columns: 1.4fr 1fr; align-items: start; }
.feed__side { display: grid; gap: 24px; padding-top: 6px; }
.feed__side .acard + .acard { padding-top: 24px; border-top: 1px solid var(--line); }
.catrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 40px; }
@media (max-width: 900px) { .feed { grid-template-columns: 1fr; } }

/* ——— Главная: присоединяйся ——— */
.joinband { position: relative; display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: end; padding: clamp(28px, 5vw, 72px) clamp(24px, 5vw, 72px) 0; border-radius: var(--r-xl); background: var(--pink); overflow: hidden; }
.joinband__text { display: grid; gap: 18px; justify-items: start; padding-bottom: clamp(28px, 5vw, 72px); }
.joinband__text .h1 { max-width: 12ch; color: var(--teal-900); }
.joinband .ticks svg { background: var(--teal-800); }
.joinband__art { align-self: end; justify-self: center; position: relative; }
.joinband__bunny { width: min(320px, 70vw); height: auto; filter: drop-shadow(0 18px 24px rgba(8, 57, 59, .2)); margin-bottom: -4px; }
@media (max-width: 800px) { .joinband { grid-template-columns: 1fr; } .joinband__text { padding-bottom: 0; } .joinband__bunny { width: 220px; } }

/* ——— Страница «Регионы» ——— */
.regions { display: grid; gap: 28px; }
.regions__fh { font: 700 .8rem var(--font-head); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; color: var(--ink-2); }
.regions__layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
.regions__map { padding: clamp(8px, 2vw, 24px); background: #fff; border-radius: var(--r-xl); box-shadow: var(--shadow-sm); }
.rpanel { display: grid; gap: 12px; padding: 22px; border-radius: var(--r-xl); background: #fff; box-shadow: var(--shadow-sm); position: sticky; top: calc(var(--header-h) + 16px); }
.rpanel--hint { grid-template-columns: 70px 1fr; align-items: center; background: var(--pink-2); box-shadow: none; }
.rpanel__media { border-radius: var(--r-md); }
.rpanel__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0; }
.rpanel__stats div { padding: 10px; border-radius: var(--r-sm); background: var(--cream-2); display: flex; flex-direction: column-reverse; }
.rpanel__stats dt { font-size: .72rem; color: var(--ink-3); }
.rpanel__stats dd { margin: 0; font: 800 1.5rem var(--font-head); color: var(--teal-700); }
.rpanel__cats { font-size: .82rem; color: var(--ink-2); }
@media (max-width: 960px) { .regions__layout { grid-template-columns: 1fr; } .rpanel { position: static; } }

/* ——— Страница региона ——— */
.rhero { background: var(--sand-2); padding-block: clamp(32px, 5vw, 64px) clamp(40px, 6vw, 88px); overflow: hidden; }
.rhero__in { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; }
.rhero__text { display: grid; gap: 20px; justify-items: start; }
.rhero__h { font-size: clamp(2.4rem, 6vw, 4.8rem); }
.rhero__stats { display: flex; gap: 12px 40px; flex-wrap: wrap; margin: 6px 0 0; }
.rhero__stats div { display: flex; flex-direction: column-reverse; }
.rhero__stats dt { font-size: .8rem; color: var(--ink-3); }
.rhero__stats dd { margin: 0; font: 800 2.2rem/1 var(--font-head); color: var(--teal-700); }
.rhero__art { position: relative; }
.rhero__media { aspect-ratio: 5 / 4; border-radius: 220px 220px var(--r-xl) var(--r-xl); box-shadow: 0 30px 60px rgba(0, 0, 0, .25); }
.rhero__bunny { position: absolute; right: -10px; bottom: -22px; width: 112px; height: auto; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .3)); }
@media (max-width: 800px) { .rhero__in { grid-template-columns: 1fr; } .rhero__media { border-radius: 120px 120px var(--r-xl) var(--r-xl); } }
.soon { display: grid; grid-template-columns: 220px 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; padding: clamp(24px, 5vw, 56px); background: var(--cream-2); border-radius: var(--r-xl); }
.soon > div { display: grid; gap: 16px; justify-items: start; }
.soon__bunny { width: 100%; height: auto; filter: drop-shadow(0 14px 18px rgba(8, 57, 59, .2)); }
.soon__cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
@media (max-width: 640px) { .soon { grid-template-columns: 1fr; } .soon__bunny { width: 150px; } }

/* ——— Подборка ——— */
.chead { background: var(--sand-2); padding-block: clamp(32px, 5vw, 64px); }
.chead__in { display: grid; grid-template-columns: 1.2fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: center; }
.chead__in > div:first-child { display: grid; gap: 16px; justify-items: start; }
.chead__media { aspect-ratio: 4 / 3; border-radius: var(--r-xl); }
@media (max-width: 800px) { .chead__in { grid-template-columns: 1fr; } }

/* ——— Каталог ——— */
.catalog { display: grid; gap: clamp(20px, 3vw, 40px); grid-template-columns: 280px minmax(0, 1fr); align-items: start; }
.catalog__aside { position: sticky; top: calc(var(--header-h) + 16px); max-height: calc(100vh - var(--header-h) - 32px); overflow: auto; padding-right: 6px; scrollbar-width: thin; }
.filters { display: grid; gap: 4px; padding: 20px; background: #fff; border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.filters__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.filters__x, .filters__apply, .catalog__ftoggle { display: none; }
.fgroup { border: 0; border-top: 1px solid var(--line); padding: 14px 0 6px; margin: 0; min-width: 0; }
.fgroup legend { padding: 0; font: 700 .78rem var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--teal-700); float: left; width: 100%; margin-bottom: 6px; }
.fgroup legend + * { clear: both; }
.range { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.range input { padding: .6em .8em; }
.catalog .grid--3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 232px), 1fr)); }
.toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar__count { font: 700 1.05rem var(--font-head); margin-right: auto; }
.toolbar__sort { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--ink-3); }
.toolbar__sort select { width: auto; padding: .55em 2em .55em .9em; }
#active { margin-bottom: 20px; min-height: 0; }
@media (max-width: 960px) {
  .catalog { grid-template-columns: 1fr; }
  .catalog__ftoggle { display: inline-flex; }
  .catalog__aside { position: fixed; inset: 0; z-index: 90; max-height: none; padding: 0; background: var(--cream); transform: translateY(100%); visibility: hidden; transition: transform .4s var(--ease), visibility 0s .4s; }
  .catalog__aside.is-open { transform: none; visibility: visible; transition-delay: 0s; }
  .filters { border-radius: 0; box-shadow: none; padding: 20px var(--gutter) 96px; min-height: 100%; background: var(--cream); }
  .filters__x { display: inline-grid; }
  .filters__head .linkbtn { margin-left: auto; }
  .filters__apply { display: inline-flex; position: fixed; left: var(--gutter); right: var(--gutter); bottom: max(16px, env(safe-area-inset-bottom)); }
}

/* ——— Медиа ——— */
.mag { display: grid; gap: clamp(28px, 4vw, 56px); }
.mag__lead .acard--cover { display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(20px, 4vw, 48px); align-items: center; }
.mag__grid { display: grid; gap: clamp(24px, 3vw, 40px); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
@media (max-width: 800px) { .mag__lead .acard--cover { grid-template-columns: 1fr; } }

/* ——— Статья ——— */
.ahead { padding-block: clamp(32px, 5vw, 64px) 32px; }
.ahead__in { display: grid; gap: 20px; max-width: 920px; margin-inline: 0; }
.ahead__h { max-width: 20ch; }
.ahead__lead { font-size: clamp(1.1rem, 1.8vw, 1.4rem); max-width: 56ch; }
.ahead__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: .86rem; color: var(--ink-3); }
.ahead__meta a { color: var(--teal-700); font-weight: 600; text-decoration: none; }
.ahead__act { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.ahead__act .fav { position: static; border: 1.5px solid var(--line); background: transparent; }
.cover__media { aspect-ratio: 21 / 9; border-radius: var(--r-xl); }
@media (max-width: 700px) { .cover__media { aspect-ratio: 4 / 3; } .ahead__act { margin-left: 0; } }
.alayout { display: grid; grid-template-columns: minmax(0, 720px) 300px; gap: clamp(32px, 6vw, 96px); justify-content: center; padding-block: clamp(32px, 5vw, 64px) clamp(48px, 7vw, 96px); }
.prose { display: grid; gap: 22px; font-size: 1.1rem; line-height: 1.75; }
.prose--flat { font-size: 1.05rem; margin-bottom: 8px; }
.prose__h { margin-top: 28px; }
.prose__quote { margin: 12px 0; padding: 8px 0 8px 28px; border-left: 4px solid var(--pink-600); }
.prose__quote p { font: 700 1.5rem/1.35 var(--font-head); letter-spacing: -.02em; color: var(--teal-800); }
.prose__quote cite { display: block; margin-top: 10px; font: 400 .85rem var(--font-body); color: var(--ink-3); }
.prose__note { display: flex; gap: 16px; align-items: center; padding: 18px 22px; border-radius: var(--r-lg); background: var(--pink-2); font-size: .98rem; line-height: 1.55; }
.prose__bunny { width: 54px; height: auto; flex: none; }
.prose__fig figcaption { margin-top: 8px; font-size: .82rem; color: var(--ink-3); }
.embed { display: grid; gap: 16px; margin-block: 8px; padding: 22px; border-radius: var(--r-xl); background: var(--cream-2); font-size: 1rem; line-height: 1.5; }
.embed__k { display: block; font: 700 .72rem var(--font-head); letter-spacing: .14em; text-transform: uppercase; color: var(--teal-600); }
.embed .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.embed .pcard__body { padding: 14px; }
.embed .pcard__title { font-size: .9rem; }
.brandembed { display: flex; align-items: center; gap: 18px; padding: 16px; border-radius: var(--r-lg); background: var(--teal-700); color: var(--cream); text-decoration: none; font-size: 1rem; line-height: 1.4; transition: transform .3s var(--ease); }
.brandembed:hover { transform: translateX(4px); }
.brandembed .embed__k { color: var(--pink); margin-bottom: 4px; }
.brandembed > span { display: grid; flex: 1; }
.brandembed b { font: 800 1.2rem var(--font-head); }
.brandembed i { font-style: normal; opacity: .8; font-size: .9rem; }
.brandembed__media { width: 84px; height: 84px; border-radius: var(--r-md); flex: none; }
.demo-banner { padding: 14px 18px; border-radius: var(--r-md); background: var(--sand-2); border: 1px dashed var(--sand); font-size: .88rem; line-height: 1.5; color: var(--ink-2); }
.sources { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); font-size: .92rem; line-height: 1.5; }
.sources ul, .sources__list { display: grid; gap: 10px; margin-top: 12px; }
.sources a, .sources__list a { display: inline-flex; gap: 6px; align-items: baseline; color: var(--teal-700); }
.aside { align-self: start; position: sticky; top: calc(var(--header-h) + 20px); }
.aside__box { display: grid; gap: 12px; padding: 22px; border-radius: var(--r-lg); background: var(--cream-2); }
.aside__sub { margin-top: 12px; }
.aside__list { display: grid; gap: 4px; }
.aside__list a, .aside__list button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; margin: 0 -10px; border: 0; background: none; border-radius: var(--r-md); text-align: left; text-decoration: none; }

.aside__list span { display: grid; line-height: 1.3; }

.bhero__text { display: grid; gap: 18px; justify-items: start; }

.blayout__h { margin-top: 20px; }
.blayout__side .aside__box { position: sticky; top: calc(var(--header-h) + 20px); }

.join { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: clamp(28px, 5vw, 72px); align-items: start; padding-bottom: clamp(32px, 6vw, 80px); }

.steps { counter-reset: s; display: grid; gap: 18px; }
.steps li { counter-increment: s; position: relative; display: grid; gap: 2px; padding-left: 46px; font-size: .92rem; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--teal-700); color: var(--cream); font: 800 .85rem var(--font-head); }

.done__mascot { width: 96px; height: auto; }

    const sp = new URLSearchParams();
    Object.entries(obj).forEach(([k, v]) => {

    const s = sp.toString();
    return s ? '?' + s : '';

  const fmtDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

/* Локальное хранилище: избранное, подписки, заявки. Всё остаётся в браузере пользователя. */
(function () {
  const KEYS = { fav: 'blizko:fav:v1', subs: 'blizko:subs:v1', leads: 'blizko:leads:v1', ui: 'blizko:ui:v1' };

  const read = (key, fallback) => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
  };
  const write = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
  };

  let fav = read(KEYS.fav, { products: [], articles: [] });
  fav.products ||= []; fav.articles ||= [];

  const emit = () => document.dispatchEvent(new CustomEvent('bl:favs', { detail: fav }));

  BL.lib.store = {
    favs: () => fav,
    isFav: (kind, id) => fav[kind].includes(id),
    toggleFav(kind, id) {
      const list = fav[kind], i = list.indexOf(id);
      i >= 0 ? list.splice(i, 1) : list.unshift(id);
      write(KEYS.fav, fav); emit();
      return i < 0;
    },
    clearFavs(kind) { fav[kind] = []; write(KEYS.fav, fav); emit(); },
    favCount: () => fav.products.length + fav.articles.length,

    addSubscriber(email) {
      const list = read(KEYS.subs, []);
      if (!list.some((s) => s.email === email)) list.push({ email, at: new Date().toISOString() });
      return write(KEYS.subs, list);
    },
    addLead(lead) {
      const list = read(KEYS.leads, []);
      list.push({ ...lead, at: new Date().toISOString() });
      return write(KEYS.leads, list);
    },
    ui: (k, v) => {
      const s = read(KEYS.ui, {});
      if (v === undefined) return s[k];
      s[k] = v; write(KEYS.ui, s);
    },
  };

  // синхронизация между вкладками
  window.addEventListener('storage', (e) => {
    if (e.key === KEYS.fav) { fav = read(KEYS.fav, { products: [], articles: [] }); emit(); }
  });
})();

/* Индексы и выборки над данными. Новые регионы/бренды/товары/статьи подхватываются автоматически. */
(function () {
  const D = BL.data;
  const { norm } = BL.lib.util;
  const by = (arr) => Object.fromEntries(arr.map((x) => [x.id, x]));

  const db = {
    region: by(D.regions), brand: by(D.brands), product: by(D.products), article: by(D.articles),
    collection: by(D.collections), category: by(D.categories), occasion: by(D.occasions), articleCategory: by(D.articleCategories),
  };

  db.regionOfProduct = (p) => db.region[db.brand[p.brand]?.region];
  db.brandsOf = (regionId) => D.brands.filter((b) => b.region === regionId);
  db.productsOf = (regionId) => D.products.filter((p) => db.brand[p.brand]?.region === regionId);
  db.productsOfBrand = (brandId) => D.products.filter((p) => p.brand === brandId);
  db.articlesOfRegion = (regionId) => D.articles.filter((a) => a.region === regionId);
  db.articlesOfBrand = (brandId) => D.articles.filter((a) => (a.brands || []).includes(brandId));
  db.collectionsOfRegion = (regionId) => D.collections.filter((c) => c.items.some((id) => db.brand[db.product[id]?.brand]?.region === regionId));
  db.stats = (regionId) => {
    const products = db.productsOf(regionId);
    return { brands: db.brandsOf(regionId).length, products: products.length, categories: [...new Set(products.map((p) => p.category))] };
  };
  db.priceRange = () => {
    const prices = D.products.map((p) => p.price).filter((x) => x != null);
    return { min: Math.min(...prices), max: Math.max(...prices) };
  };
  db.activeRegions = () => D.regions.filter((r) => r.status === 'active');
  db.related = (article, n = 3) => D.articles
    .filter((a) => a.id !== article.id)
    .map((a) => ({ a, s: (a.region === article.region ? 2 : 0) + (a.category === article.category ? 1 : 0) + (a.brands || []).filter((b) => (article.brands || []).includes(b)).length }))
    .sort((x, y) => y.s - x.s).slice(0, n).map((x) => x.a);

  const hay = {
    product: (p) => [p.name, p.type, p.desc, db.brand[p.brand]?.name, db.regionOfProduct(p)?.name, db.regionOfProduct(p)?.short, db.category[p.category]?.name].join(' '),
    brand: (b) => [b.name, b.tagline, b.about.join(' '), db.region[b.region]?.name, db.region[b.region]?.short].join(' '),
    region: (r) => [r.name, r.short, r.lead].join(' '),
    article: (a) => [a.title, a.storyTitle, a.lead, db.region[a.region]?.name, db.articleCategory[a.category]?.name].join(' '),
  };

  db.productText = hay.product;

  // поиск по всем сущностям: все слова запроса должны встретиться (по началу слова), имя весит больше
  db.search = (query) => {
    const words = BL.lib.util.words(query);
    const empty = { products: [], brands: [], regions: [], articles: [], total: 0 };
    if (!words.length) return empty;
    const score = (text, title) => {
      const t = norm(text), ti = norm(title);
      let s = 0;
      for (const w of words) {
        if (!new RegExp('(^|[^а-яa-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(t)) return 0;
        s += ti.includes(w) ? 3 : 1;
      }
      return s;
    };
    const run = (list, kind, titleOf) => list
      .map((x) => ({ x, s: score(hay[kind](x), titleOf(x)) })).filter((r) => r.s).sort((a, b) => b.s - a.s).map((r) => r.x);
    const res = {
      products: run(D.products, 'product', (p) => p.name + ' ' + (db.brand[p.brand]?.name || '')),
      brands: run(D.brands, 'brand', (b) => b.name),
      regions: run(D.regions, 'region', (r) => r.name),
      articles: run(D.articles, 'article', (a) => a.title),
    };
    res.total = res.products.length + res.brands.length + res.regions.length + res.articles.length;
    return res;
  };

  BL.db = db;
})();

/* Хэш-роутер (#/путь?query): работает на любом статическом хостинге и по file://.
   Страница — функция (params, query) → { title, description, html, mount?(root), jsonld?, image?, noindex? } */
(function () {
  const { parseQuery } = BL.lib.util;
  const routes = [];
  let root;

  const compile = (pattern) => {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:([a-z]+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '/?$');
    return { re, keys };
  };

  const setMeta = (sel, attr, value) => {
    const el = document.querySelector(sel);
    if (el && value != null) el.setAttribute(attr, value);
  };

  function applyMeta(page, path) {
    const site = BL.data.site;
    const title = page.title ? `${page.title} — ${site.name}` : `${site.name} — ${site.slogan}`;
    const desc = page.description || 'Открываем локальные бренды, необычные товары и истории со всей России.';
    document.title = title;
    setMeta('meta[name="description"]', 'content', desc);
    setMeta('meta[property="og:title"]', 'content', title);
    setMeta('meta[property="og:description"]', 'content', desc);
    setMeta('meta[name="robots"]', 'content', page.noindex ? 'noindex' : 'index,follow');
    const canon = document.querySelector('link[rel="canonical"]');
    if (canon) canon.href = location.origin + location.pathname + '#' + path;
    let ld = document.getElementById('jsonld');
    if (!page.jsonld) { ld?.remove(); return; }
    if (!ld) { ld = document.createElement('script'); ld.id = 'jsonld'; ld.type = 'application/ld+json'; document.head.appendChild(ld); }
    ld.textContent = JSON.stringify(page.jsonld);
  }

  function resolve() {
    const raw = location.hash.replace(/^#/, '') || '/';
    const [path, qs] = raw.split('?');
    const query = parseQuery(qs);
    for (const r of routes) {
      const m = path.match(r.re);
      if (m) {
        const params = {};
        r.keys.forEach((k, i) => (params[k] = decodeURIComponent(m[i + 1])));
        return { r, params, query, path };
      }
    }
    return { r: routes.find((x) => x.notFound), params: {}, query, path };
  }

  function render() {
    const { r, params, query, path } = resolve();
    const page = r.page(params, query) || {};
    BL.router.current = { path, params, query, name: r.name };
    // каждая страница живёт в своём контейнере: слушатели не копятся между переходами
    const el = document.createElement('div');
    el.className = 'page';
    el.innerHTML = page.html || '';
    root.replaceChildren(el);
    applyMeta(page, path);
    window.scrollTo({ top: 0, behavior: 'instant' });
    page.mount?.(el);
    document.dispatchEvent(new CustomEvent('bl:route', { detail: BL.router.current }));
    // доступность: фокус на основной контент после перехода
    const h = el.querySelector('h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }

  BL.router = {
    current: null,
    add(name, pattern, page, opts = {}) { routes.push({ name, ...compile(pattern), page, ...opts }); },
    start(el) { root = el; window.addEventListener('hashchange', render); render(); },
    go(path) { location.hash = '#' + path; },
    // обновить query без перерисовки страницы (для живых фильтров)
    replaceQuery(path, qs) { try { history.replaceState(null, '', '#' + path + qs); } catch { /* песочница */ } BL.router.current.query = parseQuery(qs.replace(/^\?/, '')); },
  };
})();

/* Схематичная карта России: упрощённый контур в конической проекции Альберса + кликабельные точки регионов.

(function () {
  const { esc, count } = BL.lib.util;

  const MAINLAND = [

    [40.5, 64.6], [40, 65.6], [44, 66.4], [43.3, 68.6], [47, 67.7], [53, 68.8], [58, 68.9], [60.5, 69.8], [65, 69.1], [67, 70.5], [68.2, 72.4], [70.5, 73.2],
    [72.5, 71.8], [72.8, 69.5], [73.6, 68.4], [74.2, 70], [75.5, 72.4], [78, 72.9], [80.5, 73.6], [86, 74.2], [88.2, 75.2], [95, 76], [100, 76.5], [104.3, 77.7],
    [110, 76.7], [113, 75.8], [112.4, 73.7], [118, 73.5], [124, 73.7], [127, 73.4], [129.5, 71.3], [132, 71], [139, 71.8], [142, 72.7], [150, 71.5], [160, 70.8],
    [167, 69.7], [170, 70.1], [176, 69.8], [180, 69], [183, 68.5], [188, 67.6], [190, 66.2], [188, 65.5], [186.5, 64.4], [181, 62.5], [179.2, 62.3],
    [177.5, 62.4], [177.5, 64.7], [178.8, 64.2], [180.5, 61.8], [176, 60.8], [172, 60.5], [170, 60], [166, 59.8], [164, 59.1], [163.4, 57.9], [163.2, 56],
    [162.5, 54.6], [160.2, 53.2], [158.6, 52.9], [156.7, 50.9], [155.8, 52.5], [155.6, 54.6], [156, 57], [158.5, 58.8], [160, 60.5], [162, 62], [158, 61.2],
    [155.5, 59.5], [150.8, 59.5], [146, 59.2], [143, 59.4], [139.8, 58.1], [138.2, 56.5], [137, 54.5], [140, 54], [141.3, 53.2], [141.5, 52], [140.6, 50],
    [140.3, 48.5], [138.5, 46.5], [135.5, 43.8], [133, 42.8], [131.8, 42.9], [130.7, 42.3], [131.2, 43.4], [131.2, 44.9], [133.1, 45.1], [133.7, 46.3],
    [134.7, 47.7], [135, 48.4], [132.5, 47.7], [131, 47.7], [130.6, 48.7], [127.5, 49.8], [126.5, 51], [124, 53], [120.7, 53.3], [119.3, 52.7], [120, 51.9],
    [118.5, 49.9], [116.7, 49.8], [114, 50.2], [112, 49.4], [108.5, 49.3], [106.5, 50.3], [102, 51.3], [98, 50], [95, 49.9], [92, 50.7], [89.5, 49.6],
    [87.8, 49.2], [85.8, 49.1], [83.5, 50.9], [80.2, 51.2], [77.7, 53.2], [76.6, 54.2], [73.4, 53.9], [71, 55.1], [69, 55.4], [65.3, 54.7], [61.5, 54],
    [61, 52.5], [59.9, 50.7], [55.5, 50.5], [51.5, 51.5], [48.5, 50], [46.7, 49.9], [47, 48.5], [47.9, 46.3], [47.4, 45.2], [47.5, 44], [48.5, 42.2],
    [48, 41.8], [46.6, 41.8], [45, 42.2], [42.5, 43.1], [40.1, 43.6], [39.1, 44.1], [37.8, 44.7], [36.9, 45.3], [38.1, 46.1], [38.9, 47.2], [40.1, 47.7],
    [39.7, 49], [38.2, 50], [35.5, 51.1], [34.3, 51.9], [32.5, 52.8], [31.7, 53.9], [31, 55], [30.9, 55.8], [29.6, 56.2], [28.2, 56.2], [27.8, 57.3],
    [27.6, 58.3], [28, 59.4], [29, 59.8], [30.2, 59.9], [28.5, 60.6], [29.5, 61.7], [31.4, 62.9], [30.1, 64.5], [29.9, 66], [29.1, 67.3], [28.8, 69.1],
  ];
  const ISLANDS = [
    [[51.5, 71.5], [53, 72.8], [56.5, 74.3], [60, 76.2], [68, 76.8], [68.5, 76], [62, 74.5], [58, 72.5], [57, 70.7], [55, 70.6], [52, 71]], // Новая Земля
    [[142.2, 54.3], [143.2, 52.8], [143.2, 50.8], [144.1, 49], [143.5, 46.5], [142.8, 46], [142.1, 46.7], [141.9, 48.5], [142.2, 50.5], [141.8, 52]], // Сахалин
    [[19.65, 54.45], [20.5, 54.95], [21.3, 55.2], [22.8, 54.35], [22.6, 54], [21, 54.2]], // Калининградская область
  ];

  // Альберс (равновеликая коническая): параллели 52° и 64°, центр 100° в.д.
  const rad = Math.PI / 180;
  const φ1 = 52 * rad, φ2 = 64 * rad, φ0 = 56 * rad, λ0 = 100;
  const n = (Math.sin(φ1) + Math.sin(φ2)) / 2;
  const C = Math.cos(φ1) ** 2 + 2 * n * Math.sin(φ1);
  const ρ0 = Math.sqrt(C - 2 * n * Math.sin(φ0)) / n;
  const raw = (lon, lat) => {
    const ρ = Math.sqrt(C - 2 * n * Math.sin(lat * rad)) / n, θ = n * (lon - λ0) * rad;
    return [ρ * Math.sin(θ), -(ρ0 - ρ * Math.cos(θ))];
  };

  const all = MAINLAND.concat(...ISLANDS).map(([lo, la]) => raw(lo, la));
  const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = 1000, PAD = 28, S = (W - PAD * 2) / (x1 - x0), H = Math.round((y1 - y0) * S + PAD * 2);
  const proj = (lon, lat) => { const [x, y] = raw(lon, lat); return [PAD + (x - x0) * S, PAD + (y - y0) * S]; };
  const poly = (pts) => 'M' + pts.map(([lo, la]) => proj(lo, la).map((v) => v.toFixed(1)).join(' ')).join('L') + 'Z';

  let landPath;

  let gridPath;
  const grid = () => {
    if (gridPath) return gridPath;
    let d = '';
    for (let la = 40; la <= 80; la += 10) { d += 'M' + Array.from({ length: 40 }, (_, i) => proj(10 + i * 4.6, la).map((v) => v.toFixed(1)).join(' ')).join('L'); }
    for (let lo = 20; lo <= 180; lo += 20) { d += 'M' + Array.from({ length: 12 }, (_, i) => proj(lo, 38 + i * 4).map((v) => v.toFixed(1)).join(' ')).join('L'); }
    return (gridPath = d);
  };

  /** Карта. opts: mode 'navigate' | 'select', activeId, dimmed:Set<regionId>, showAllLabels */
  function render(opts = {}) {
    const { regions } = BL.data;
    const pins = regions.map((r) => {
      const [x, y] = proj(r.lon, r.lat);
      const st = BL.db.stats(r.id);
      const soon = r.status !== 'active';
      const cls = ['pin', soon ? 'pin--soon' : 'pin--active', `pin--${r.label || 'right'}`, opts.activeId === r.id ? 'is-active' : '', opts.dimmed?.has(r.id) ? 'is-dim' : ''].join(' ');
      const href = `#/region/${r.id}`;
      const meta = soon ? 'Скоро' : count(st.brands, ['бренд', 'бренда', 'брендов']);
      const label = `${r.name}: ${soon ? 'раздел готовится' : meta}`;
      const inner = `<span class="pin__dot" aria-hidden="true"></span><span class="pin__label"><b>${esc(r.short)}</b><i>${esc(meta)}</i></span>`;
      const pos = `left:${((x / W) * 100).toFixed(2)}%;top:${((y / H) * 100).toFixed(2)}%`;
      return opts.mode === 'select'
        ? `<button type="button" class="${cls}" style="${pos}" data-pin="${r.id}" aria-label="${esc(label)}" aria-pressed="${opts.activeId === r.id}">${inner}</button>`
        : `<a class="${cls}" style="${pos}" href="${href}" aria-label="${esc(label)}">${inner}</a>`;
    }).join('');
    // красная «нить» между активными регионами — отсылка к логотипу
    const act = regions.filter((r) => r.status === 'active').map((r) => proj(r.lon, r.lat));
    let thread = '';
    if (act.length > 1) {
      const [a, b] = [act[0], act[1]];
      const mx = (a[0] + b[0]) / 2, my = Math.min(a[1], b[1]) - 120;
      thread = `<path class="map__thread" d="M${b[0].toFixed(1)} ${b[1].toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${a[0].toFixed(1)} ${a[1].toFixed(1)}"/>`;
    }
    return `<div class="map" style="aspect-ratio:${W}/${H}">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Схематичная карта России с регионами-участниками" xmlns="http://www.w3.org/2000/svg">
        <defs><pattern id="map-dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" class="map__dot"/></pattern></defs>
        <path d="${grid()}" class="map__grid"/>
        <path d="${land()}" class="map__land"/><path d="${land()}" fill="url(#map-dots)"/><path d="${land()}" class="map__edge"/>
        ${thread}
      </svg>${pins}</div>`;
  }

  BL.lib.russiaMap = { render, proj };
})();

/* Формы: подписка на новости и заявка производителя.
   У прототипа нет сервера: данные сохраняются в localStorage браузера, об этом честно сказано пользователю.
   Чтобы подключить бэкенд, замените store.addSubscriber / store.addLead на fetch. */
(function () {
  const { esc } = BL.lib.util;
  const store = BL.lib.store;
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  const subscribeForm = (ctx) => `<form class="subscribe" data-subscribe novalidate>
      <label class="sr-only" for="sub-${ctx}">Ваш email для рассылки</label>
      <input id="sub-${ctx}" type="email" name="email" placeholder="Ваш email" autocomplete="email" required>
      <button class="btn btn--pink" type="submit">Подписаться</button>
      <p class="form__msg" role="status" aria-live="polite"></p></form>`;

  const field = (name, label, { type = 'text', required = false, hint = '', attrs = '' } = {}) => `<div class="field">
      <label for="f-${name}">${label}${required ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>
      <input id="f-${name}" name="${name}" type="${type}" ${required ? 'required' : ''} ${attrs} aria-describedby="e-${name}${hint ? ' h-' + name : ''}">
      ${hint ? `<p class="field__hint" id="h-${name}">${hint}</p>` : ''}<p class="field__err" id="e-${name}" role="alert"></p></div>`;

  const joinForm = (preRegion = '') => {
    const regs = BL.data.regions.map((r) => `<option value="${esc(r.id)}"${preRegion === r.id ? ' selected' : ''}>${esc(r.name)}</option>`).join('');
    const cats = BL.data.categories.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    return `<form class="form" data-join novalidate>
      <div class="form__grid">
        ${field('brand', 'Название бренда', { required: true })}
        ${field('name', 'Ваше имя', { required: true, attrs: 'autocomplete="name"' })}
        <div class="field"><label for="f-region">Регион <span class="req" aria-hidden="true">*</span></label>
          <select id="f-region" name="region" required aria-describedby="e-region"><option value="">Выберите регион</option>${regs}<option value="other">Другой регион</option></select><p class="field__err" id="e-region" role="alert"></p></div>
        <div class="field"><label for="f-category">Что вы делаете <span class="req" aria-hidden="true">*</span></label>
          <select id="f-category" name="category" required aria-describedby="e-category"><option value="">Выберите категорию</option>${cats}</select><p class="field__err" id="e-category" role="alert"></p></div>
        ${field('email', 'Email для связи', { type: 'email', required: true, attrs: 'autocomplete="email"' })}
        ${field('link', 'Сайт или соцсети', { type: 'url', hint: 'Где можно купить ваши товары — туда мы будем вести читателей', attrs: 'placeholder="https://"' })}
      </div>
      <div class="field"><label for="f-about">Расскажите о бренде</label>
        <textarea id="f-about" name="about" rows="5" placeholder="Что делаете, кто вы, чем гордитесь" aria-describedby="e-about"></textarea><p class="field__err" id="e-about" role="alert"></p></div>
      <div class="field field--check"><label><input type="checkbox" name="consent" required aria-describedby="e-consent"> Согласен(на), что команда БЛИЗКО свяжется со мной по указанному email <span class="req" aria-hidden="true">*</span></label><p class="field__err" id="e-consent" role="alert"></p></div>
      <button class="btn btn--primary btn--lg" type="submit">Отправить заявку</button>
      <p class="form__msg" role="status" aria-live="polite"></p>
      <p class="field__hint">Это прототип без сервера: заявка сохраняется только в вашем браузере.</p></form>`;
  };

  const setErr = (form, name, msg) => {
    const input = form.elements[name], err = form.querySelector('#e-' + name);
    if (err) err.textContent = msg || '';
    input?.setAttribute('aria-invalid', msg ? 'true' : 'false');
  };

  function onSubscribe(form) {
    const input = form.elements.email, msg = form.querySelector('.form__msg'), v = input.value.trim();
    if (!EMAIL.test(v)) {
      msg.textContent = 'Проверьте адрес: он должен выглядеть как name@example.ru'; msg.className = 'form__msg is-err';
      input.setAttribute('aria-invalid', 'true'); input.focus(); return;
    }
    input.setAttribute('aria-invalid', 'false');
    const ok = store.addSubscriber(v);
    msg.className = 'form__msg is-ok';
    msg.textContent = ok ? 'Спасибо! Адрес сохранён в этом браузере — в прототипе письма не отправляются.' : 'Не получилось сохранить адрес: в браузере отключено хранилище.';
    if (ok) form.reset();
  }

  function onJoin(form) {
    const d = Object.fromEntries(new FormData(form));
    const rules = {
      brand: !d.brand?.trim() && 'Укажите название бренда', name: !d.name?.trim() && 'Укажите ваше имя',
      region: !d.region && 'Выберите регион', category: !d.category && 'Выберите категорию',
      email: !EMAIL.test(d.email?.trim() || '') && 'Укажите корректный email',
      link: d.link?.trim() && !/^https?:\/\/\S+\.\S+/.test(d.link.trim()) && 'Ссылка должна начинаться с https://',
      consent: !d.consent && 'Нужно ваше согласие на связь',
    };
    let first;
    Object.entries(rules).forEach(([k, bad]) => { setErr(form, k, bad || ''); if (bad && !first) first = k; });
    if (first) { form.elements[first].focus(); return; }
    const ok = store.addLead({ brand: d.brand.trim(), name: d.name.trim(), region: d.region, category: d.category, email: d.email.trim(), link: d.link?.trim() || '', about: d.about?.trim() || '' });
    const wrap = form.closest('.join__form');
    wrap.innerHTML = `<div class="done" role="status" tabindex="-1">${BL.ui.mascot('sm', 'done__mascot')}<h2 class="h2">${ok ? 'Заявка сохранена' : 'Не удалось сохранить'}</h2>
      <p class="lead">${ok ? `Спасибо, ${esc(d.name.trim())}! Заявка бренда «${esc(d.brand.trim())}» сохранена в этом браузере.` : 'В вашем браузере отключено локальное хранилище.'}</p>
      <p class="muted">Пока БЛИЗКО — прототип без сервера, поэтому заявка никуда не отправлена. В рабочей версии мы ответим на ${esc(d.email.trim())}.</p>
      <div class="done__actions"><a class="btn btn--primary" href="#/regions">Вернуться к регионам</a><a class="btn btn--ghost" href="#/media">Читать журнал</a></div></div>`;
    wrap.querySelector('.done').focus();
  }

  function bind() {
    document.addEventListener('submit', (e) => {
      const f = e.target;
      if (f.matches('[data-subscribe]')) { e.preventDefault(); onSubscribe(f); }
      else if (f.matches('[data-join]')) { e.preventDefault(); onJoin(f); }
    });
  }

  BL.ui.subscribeForm = subscribeForm;
  BL.ui.joinForm = joinForm;
  BL.forms = { bind };
})();

;

          <p class="footer__slogan">То, что далеко, становится БЛИЗКО</p>

  /* ——— Поиск ——— */
  function searchDialog() {
    return `<dialog class="search" id="search" aria-label="Поиск по сайту"><div class="search__in">
      <form class="search__form" role="search" data-search-form>

  }

  function searchPreview(q) {

    if (!q.trim()) {
      el.innerHTML = `<p class="muted search__hint">Попробуйте: <button class="chip" data-q="шоколад">шоколад</button> <button class="chip" data-q="лава">лава</button> <button class="chip" data-q="Мурманск">Мурманск</button> <button class="chip" data-q="флис">флис</button></p>`;

      ? `<a class="btn btn--primary btn--sm" href="${a.href}">${esc(a.text)}</a>` : `<button type="button" class="btn btn--ghost btn--sm" data-blizya="${a.act}">${esc(a.text)}</button>`).join('');
