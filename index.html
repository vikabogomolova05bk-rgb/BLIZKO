    if (s.sort === 'price-desc') list = [...list].sort((a, b) => (a.price == null) - (b.price == null) || (b.price ?? 0) - (a.price ?? 0));
    if (s.sort === 'name') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
    return list;
  }

  const group = (title, name, items, selected, counts) => `<fieldset class="fgroup"><legend>${title}</legend>
    ${items.map((i) => `<label class="check"><input type="checkbox" name="${name}" value="${esc(i.id)}"${selected.includes(i.id) ? ' checked' : ''}><span>${esc(i.name)}</span><em>${counts[i.id] || 0}</em></label>`).join('')}</fieldset>`;

  function filtersHTML(s) {
    const cnt = (fn) => D.products.reduce((m, p) => { [].concat(fn(p)).forEach((k) => (m[k] = (m[k] || 0) + 1)); return m; }, {});
    const range = db.priceRange();
    return `<form class="filters" id="filters" role="search" aria-label="Фильтры каталога" novalidate>
      <div class="filters__head"><h2 class="h3">Фильтры</h2><button type="button" class="linkbtn" data-reset>Сбросить</button><button type="button" class="iconbtn filters__x" data-filters-close aria-label="Закрыть фильтры">${icon('close', 22)}</button></div>
      <div class="field"><label for="cq">Поиск по каталогу</label><input id="cq" type="search" name="q" value="${esc(s.q)}" placeholder="Название, бренд, материал" autocomplete="off"></div>
      ${group('Регион', 'region', D.regions.filter((r) => r.status === 'active'), s.region, cnt((p) => db.brand[p.brand].region))}
      ${group('Категория', 'cat', D.categories, s.cat, cnt((p) => p.category))}
      ${group('Тип товара', 'type', types().map((t) => ({ id: t, name: t })), s.type, cnt((p) => p.type))}
      ${group('Повод', 'occ', D.occasions, s.occ, cnt((p) => p.occasions || []))}
      <fieldset class="fgroup"><legend>Цена, ₽</legend>
        <div class="range"><label class="sr-only" for="pmin">Цена от</label><input id="pmin" type="number" inputmode="numeric" min="0" name="min" value="${esc(s.min)}" placeholder="от ${range.min}">
          <span aria-hidden="true">—</span><label class="sr-only" for="pmax">Цена до</label><input id="pmax" type="number" inputmode="numeric" min="0" name="max" value="${esc(s.max)}" placeholder="до ${range.max}"></div>
        <label class="check"><input type="checkbox" name="priced" value="1"${s.priced ? ' checked' : ''}><span>Только с подтверждённой ценой</span></label>
        <p class="fineprint">Цену мы показываем, если видели её на сайте продавца. С ценовым диапазоном товары без цены скрываются.</p></fieldset>
      <button type="button" class="btn btn--primary filters__apply" data-filters-close>Показать результаты</button></form>`;
  }

  const readState = (form) => {
    const d = new FormData(form);
    return { q: d.get('q') || '', region: d.getAll('region'), cat: d.getAll('cat'), type: d.getAll('type'), occ: d.getAll('occ'), min: d.get('min') || '', max: d.get('max') || '', priced: d.get('priced') === '1', sort: document.getElementById('sort')?.value || '' };
  };

  function activeChips(s) {
    const out = [];
    s.region.forEach((v) => out.push(['region', v, db.region[v]?.name]));
    s.cat.forEach((v) => out.push(['cat', v, db.category[v]?.name]));
    s.type.forEach((v) => out.push(['type', v, v]));
    s.occ.forEach((v) => out.push(['occ', v, db.occasion[v]?.name]));
    if (s.min !== '' || s.max !== '') out.push(['price', '', `Цена ${s.min !== '' ? 'от ' + fmtPrice(+s.min) : ''} ${s.max !== '' ? 'до ' + fmtPrice(+s.max) : ''}`.trim()]);
    if (s.priced) out.push(['priced', '', 'Только с ценой']);
    if (s.q.trim()) out.push(['q', '', `«${s.q.trim()}»`]);
    return out.filter((c) => c[2]).map(([k, v, label]) => `<button type="button" class="chip chip--x is-on" data-remove="${k}" data-value="${esc(v)}">${esc(label)} ${icon('close', 14)}<span class="sr-only"> — убрать фильтр</span></button>`).join('');
  }

  function catalog(params, query) {
    const s = fromQuery(query), list = apply(s);
    const region = s.region.length === 1 ? db.region[s.region[0]] : null;
    return {
      title: region ? `Каталог: ${region.short}` : 'Каталог', description: 'Каталог локальных товаров из регионов России: фильтры по региону, категории, цене и поводу. Покупка — на сайте производителя.',
      html: `<section class="pagehead"><div class="container"><p class="eyebrow">MARKET</p><h1 class="h1">Каталог находок</h1>
          <p class="lead">Товары небольших брендов из регионов. Кнопка ведёт на сайт производителя или продавца — там вы выбираете размер, оформляете заказ и платите.</p></div></section>
        <section class="section--tight"><div class="container catalog">
          <aside class="catalog__aside" id="filters-wrap">${filtersHTML(s)}</aside>
          <div class="catalog__main">
            <div class="toolbar"><button type="button" class="btn btn--ghost btn--sm catalog__ftoggle" data-filters-open aria-controls="filters-wrap">${icon('filter', 18)} Фильтры</button>
              <p class="toolbar__count" id="count" role="status" aria-live="polite"></p>
              <label class="toolbar__sort">Сортировка <select id="sort" name="sort">${SORTS.map((o) => `<option value="${o.id}"${s.sort === o.id ? ' selected' : ''}>${o.name}</option>`).join('')}</select></label></div>
            <div class="chips" id="active" aria-label="Выбранные фильтры"></div>
            <div class="grid grid--3" id="results"></div>
          </div></div></section>`,
      mount(root) {
        const form = root.querySelector('#filters'), resEl = root.querySelector('#results'), cnt = root.querySelector('#count'), act = root.querySelector('#active'), wrap = root.querySelector('#filters-wrap');
        const update = () => {
          const st = readState(form), items = apply(st);
          cnt.textContent = count(items.length, ['товар', 'товара', 'товаров']);
          act.innerHTML = activeChips(st);
          resEl.innerHTML = items.length ? items.map(productCard).join('')
            : `<div class="grid__empty">${empty({ title: 'Ничего не нашли', text: 'Попробуйте убрать часть фильтров. Каталог пока небольшой: мы только начинаем собирать бренды.', action: '<button type="button" class="btn btn--primary" data-reset>Сбросить фильтры</button>' })}</div>`;
          BL.router.replaceQuery('/catalog', toQuery(st));
        };
        update();
        form.addEventListener('input', debounce(update, 120));
        form.addEventListener('submit', (e) => e.preventDefault());
        root.querySelector('#sort').addEventListener('change', update);
        const reset = () => { form.reset(); form.querySelectorAll('input[type=number],input[type=search]').forEach((i) => (i.value = '')); form.querySelectorAll('input[type=checkbox]').forEach((i) => (i.checked = false)); root.querySelector('#sort').value = ''; update(); };
        root.addEventListener('click', (e) => {
          if (e.target.closest('[data-reset]')) reset();
          if (e.target.closest('[data-filters-open]')) { wrap.classList.add('is-open'); document.body.classList.add('menu-open'); form.querySelector('input')?.focus(); }
          if (e.target.closest('[data-filters-close]')) { wrap.classList.remove('is-open'); document.body.classList.remove('menu-open'); }
          const rm = e.target.closest('[data-remove]');
          if (rm) {
            const { remove: k, value: v } = rm.dataset;
            if (k === 'price') { form.elements.min.value = ''; form.elements.max.value = ''; }
            else if (k === 'priced') form.elements.priced.checked = false;
            else if (k === 'q') form.elements.q.value = '';
            else form.querySelectorAll(`input[name="${k}"]`).forEach((i) => { if (i.value === v) i.checked = false; });
            update();
          }
        });
        // закрыть выезжающую панель при уходе со страницы
        document.addEventListener('bl:route', () => document.body.classList.remove('menu-open'), { once: true });
      },
    };
  }

  BL.pages.catalog = catalog;
})();

      const tabs = `<div class="tabs" role="tablist" aria-label="Избранное">
        <button type="button" role="tab" class="tab" data-tab="products" aria-selected="${tab === 'products'}">Товары <span class="chip__n">${prods.length}</span></button>
        <button type="button" role="tab" class="tab" data-tab="articles" aria-selected="${tab === 'articles'}">Статьи <span class="chip__n">${arts.length}</span></button></div>`;
      const list = tab === 'products' ? prods : arts;
      const content = list.length
        ? `<div class="grid grid--3">${list.map((x) => (tab === 'products' ? productCard(x) : articleCard(x))).join('')}</div><p class="favs__clear"><button type="button" class="linkbtn" data-clear="${tab}">Очистить список</button></p>`
        : empty({ title: tab === 'products' ? 'Пока нет сохранённых товаров' : 'Пока нет сохранённых статей', text: 'Нажмите на сердечко на карточке, чтобы сохранить находку. Список хранится только в этом браузере.', action: tab === 'products' ? '<a class="btn btn--primary" href="#/catalog">Перейти в каталог</a>' : '<a class="btn btn--primary" href="#/media">Читать журнал</a>' });
      return tabs + content;
    };
    return {
      title: 'Избранное', noindex: true, description: 'Сохранённые товары и статьи.',
      html: `<section class="pagehead"><div class="container"><p class="eyebrow">Избранное</p><h1 class="h1">Ваши находки</h1><p class="lead">Список хранится в вашем браузере и никуда не отправляется.</p></div></section>
        <section class="section--tight"><div class="container" id="favs">${body()}</div></section>`,
      mount(root) {
        const slot = root.querySelector('#favs');
        // карточка пропадает из списка, как только её убрали из избранного
        const repaint = () => { if (!slot.isConnected) return document.removeEventListener('bl:favs', repaint); slot.innerHTML = body(); };
        document.addEventListener('bl:favs', repaint);
        slot.addEventListener('click', (e) => {
          const t = e.target.closest('[data-tab]'), c = e.target.closest('[data-clear]');
          if (t) BL.router.go('/favorites' + (t.dataset.tab === 'articles' ? '?tab=articles' : ''));
          if (c) { store.clearFavs(c.dataset.clear); BL.layout.toast('Список очищен'); }
        });
      },
    };
  };

  /* ——— Для производителей ——— */
  BL.pages.join = (params, query) => {
    const pre = db.region[query.region?.[0]] ? query.region[0] : '';
    return {
      title: 'Для производителей', description: 'Расскажите о своём бренде: мы подготовим страницу с историей и товарами и поведём читателей на ваш сайт.',
      html: `<section class="pagehead"><div class="container"><p class="eyebrow">Для производителей</p><h1 class="h1">Присоединяйся к БЛИЗКО</h1>
          <p class="lead">Расскажите о бренде — мы подготовим страницу с историей и товарами и приведём читателей к вам на сайт.</p></div></section>
        <section class="section--tight"><div class="container join">
          <div class="join__form">${joinForm(pre)}</div>
          <aside class="join__side"><div class="aside__box"><p class="eyebrow">Как это работает</p>
            <ol class="steps"><li><b>Вы оставляете заявку</b><span>Коротко о бренде, регионе и ссылка, где можно купить.</span></li>
              <li><b>Мы изучаем и уточняем</b><span>Проверяем сведения по открытым источникам и общаемся с вами.</span></li>
              <li><b>Готовим страницу</b><span>История, фотографии, товары — и место на карте.</span></li>
              <li><b>Читатели идут к вам</b><span>Покупка остаётся на вашем сайте: мы не берём оплату и доставку на себя.</span></li></ol>
            ${mascot('sm', 'join__bunny')}</div></aside></div></section>`,
    };
  };

  /* ——— О проекте ——— */
  BL.pages.about = () => ({
    title: 'О проекте', description: 'БЛИЗКО — платформа о локальных брендах России: каталог находок, журнал и карта регионов.',
    html: `<section class="pagehead"><div class="container"><p class="eyebrow">О проекте</p><h1 class="h1">То, что далеко, становится БЛИЗКО</h1>
        <p class="lead">Регионы России — это не только достопримечательности. Это дизайнеры, мастера, производители и вещи, которые сложно встретить в обычных магазинах. Мы помогаем их найти.</p></div></section>
      <section class="section--tight"><div class="container pillars pillars--about">
        <article class="pillar pillar--market"><span class="pillar__k">MARKET</span><h2 class="h3">Каталог находок</h2><p>Товары локальных брендов. Кнопка ведёт на сайт производителя или продавца.</p><a class="btn btn--link" href="#/catalog">В каталог ${icon('arrow', 18)}</a></article>
        <article class="pillar pillar--media"><span class="pillar__k">MEDIA</span><h2 class="h3">Журнал</h2><p>Истории брендов, вкусы регионов, подборки и истории вещей.</p><a class="btn btn--link" href="#/media">Читать ${icon('arrow', 18)}</a></article>
        <article class="pillar pillar--map"><span class="pillar__k">MAP</span><h2 class="h3">Карта</h2><p>Интерактивная карта регионов: нажмите — и откройте местные бренды.</p><a class="btn btn--link" href="#/regions">К карте ${icon('arrow', 18)}</a></article></div></section>
      <section class="section band band--cream2"><div class="container about2">
        <div><p class="eyebrow">Принципы</p><h2 class="h2">Что БЛИЗКО — и чем не является</h2>
          <ul class="ticks ticks--lg"><li>${icon('check', 20)} <span><b>Не маркетплейс.</b> У нас нет корзины, оплаты и доставки. Покупаете на сайте производителя.</span></li>
            <li>${icon('check', 20)} <span><b>Только проверенные ссылки.</b> Каждая ссылка ведёт на реальную страницу продавца. Если страницу товара мы не подтвердили, ведём в раздел или на главную магазина.</span></li>
            <li>${icon('check', 20)} <span><b>Цена — только подтверждённая.</b> Мы показываем цену, если видели её на сайте продавца, и пишем дату проверки.</span></li>
            <li>${icon('check', 20)} <span><b>Честность вместо красивых выдумок.</b> Неподтверждённые бренды отмечены как демонстрационные, а в статьях мы пишем, чего пока не знаем.</span></li></ul></div>
        <div class="about2__bunny">${mascot('lg', '', 'Близя — проводник по платформе')}<p class="about2__name"><b>Близя</b> — наш проводник. Помогает исследовать регионы и подсказывает интересные подборки.</p></div></div></section>
      <section class="section"><div class="container"><div class="notice"><h2 class="h3">О фотографиях в прототипе</h2>
        <p>Здесь вместо фотографий — иллюстрации-заглушки, нарисованные кодом. Настоящую съёмку (товары, мастерские, люди) подключают полем <code>image</code> в данных региона, бренда, товара или статьи — карточки подхватят её без изменения вёрстки.</p></div></div></section>`,
  });

  /* ——— Поиск ——— */
  BL.pages.search = (params, query) => {
    const q = (query.q?.[0] || '').trim(), r = db.search(q);
    const sec = (title, html) => html ? `<section class="section--tight"><div class="container">${sectionHead({ title, tag: 'h2' })}${html}</div></section>` : '';
    return {
      title: q ? `Поиск: ${q}` : 'Поиск', noindex: true, description: 'Поиск по товарам, брендам, регионам и статьям БЛИЗКО.',
      html: `<section class="pagehead"><div class="container"><p class="eyebrow">Поиск</p><h1 class="h1">${q ? `Результаты по «${esc(q)}»` : 'Что вы ищете?'}</h1>
          <form class="bigsearch" data-search-page role="search"><label class="sr-only" for="sp">Поисковый запрос</label><input id="sp" type="search" name="q" value="${esc(q)}" placeholder="Шоколад, лава, Мурманск…" autocomplete="off"><button class="btn btn--primary" type="submit">Найти</button></form>
          ${q ? `<p class="muted">${r.total ? 'Найдено: ' + r.total : ''}</p>` : ''}</div></section>
        ${q && !r.total ? `<section class="section--tight"><div class="container">${empty({ title: 'Ничего не нашлось', text: 'Попробуйте другое слово — например, «шоколад», «лава» или название региона.', action: '<a class="btn btn--primary" href="#/catalog">Открыть каталог</a>' })}</div></section>` : ''}
        ${sec('Товары', r.products.length ? `<div class="grid grid--4">${r.products.map(productCard).join('')}</div>` : '')}
        ${sec('Бренды', r.brands.length ? `<div class="grid grid--4">${r.brands.map(brandCard).join('')}</div>` : '')}
        ${sec('Регионы', r.regions.length ? `<div class="grid grid--3">${r.regions.map(regionCard).join('')}</div>` : '')}
        ${sec('Материалы', r.articles.length ? `<div class="grid grid--3">${r.articles.map((a) => articleCard(a)).join('')}</div>` : '')}`,
      mount(root) {
        root.querySelector('[data-search-page]').addEventListener('submit', (e) => { e.preventDefault(); BL.router.go('/search?q=' + encodeURIComponent(e.target.q.value.trim())); });
        if (!q) root.querySelector('#sp').focus();
      },
    };
  };

  /* ——— 404 ——— */
  BL.pages.notFound = () => ({
    title: 'Страница не найдена', noindex: true,
    html: `<section class="section"><div class="container"><div class="soon">${mascot('lg', 'soon__bunny')}<div><p class="eyebrow">Ошибка 404</p><h1 class="h1">Тут никого, даже меня</h1>
        <p class="lead">Такой страницы нет или она переехала. Вернёмся на главную или посмотрим карту?</p>
        <div class="soon__cta"><a class="btn btn--primary btn--lg" href="#/">На главную</a><a class="btn btn--ghost btn--lg" href="#/regions">К карте регионов</a></div></div></div></div></section>`,
  });
})();

;
/* Точка входа: маршруты и глобальные обработчики (делегирование) */
(function () {
  const R = BL.router, store = BL.lib.store, L = () => BL.layout;
  const P = BL.pages;

  R.add('home', '/', P.home);
  R.add('regions', '/regions', P.regions);
  R.add('region', '/region/:id', P.region);
  R.add('catalog', '/catalog', P.catalog);
  R.add('collection', '/collection/:id', P.collection);
  R.add('media', '/media', P.media);
  R.add('article', '/article/:id', P.article);
  R.add('brand', '/brand/:id', P.brand);
  R.add('favorites', '/favorites', P.favorites);
  R.add('join', '/join', P.join);
  R.add('about', '/about', P.about);
  R.add('search', '/search', P.search);
  R.add('notfound', '/__404', P.notFound, { notFound: true });

  const syncFav = (kind, id, on) => {
    document.querySelectorAll(`[data-fav="${kind}:${CSS.escape(id)}"]`).forEach((b) => {
      b.setAttribute('aria-pressed', on);
      b.setAttribute('aria-label', (on ? 'Убрать из избранного' : 'Добавить в избранное') + (b.getAttribute('aria-label')?.includes(':') ? b.getAttribute('aria-label').slice(b.getAttribute('aria-label').indexOf(':')) : ''));
    });
  };

  async function copyLink() {
    try { await navigator.clipboard.writeText(location.href); L().toast('Ссылка скопирована'); }
    catch {
      const t = document.createElement('textarea'); t.value = location.href; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); L().toast('Ссылка скопирована'); } catch { L().toast('Скопируйте ссылку из адресной строки'); }
      t.remove();
    }
  }

  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('[data-skip]')) { e.preventDefault(); document.getElementById('app').focus(); return; }
    const fav = t.closest('[data-fav]');
    if (fav) {
      const [kind, id] = fav.dataset.fav.split(':');
      const on = store.toggleFav(kind, id);
      syncFav(kind, id, on);
      L().toast(on ? 'Добавлено в избранное' : 'Убрано из избранного');
      return;
    }
    const quick = t.closest('[data-quick]');
    if (quick) { L().openQuick(quick.dataset.quick); return; }
    if (t.closest('[data-open-search]')) { L().openSearch(); return; }
    const closer = t.closest('[data-close-dialog]');
    if (closer) { closer.closest('dialog')?.close(); return; }
    if (t.matches('dialog')) { t.close(); return; } // клик по подложке
    if (t.closest('[data-toggle-menu]')) { L().toggleMenu(); return; }
    const bl = t.closest('[data-blizya]');
    if (bl) { L().blizyaAction(bl.dataset.blizya); return; }
    if (t.closest('[data-copy]')) { copyLink(); return; }
    const q = t.closest('[data-q]');
    if (q) { L().openSearch(q.dataset.q); return; }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'search-input') L().searchPreview(e.target.value);
  });
  document.addEventListener('submit', (e) => {
    if (!e.target.matches('[data-search-form]')) return;
    e.preventDefault();
    const q = e.target.q.value.trim();
    if (!q) return;
    document.getElementById('search').close();
    R.go('/search?q=' + encodeURIComponent(q));
  });
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
    if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !document.querySelector('dialog[open]')) { e.preventDefault(); L().openSearch(); }
    if (e.key === 'Escape') {
      const m = document.getElementById('mnav');
      if (m && !m.hidden) { L().toggleMenu(); document.querySelector('[data-toggle-menu]').focus(); }
    }
  });
  window.addEventListener('scroll', () => document.getElementById('header')?.classList.toggle('is-scrolled', scrollY > 8), { passive: true });

  BL.forms.bind();
  L().mount();
  R.start(document.getElementById('app'));
})();

</script>

</body>
